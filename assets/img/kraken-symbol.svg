<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" fill="none">
  <!-- Kraken Minimalist Geometric Symbol (Aelton SM Brand Baseline) -->
  <defs>
    <linearGradient id="krakenGrad" x1="250" y1="40" x2="250" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g id="kraken-mark" fill="url(#krakenGrad)">
    <!-- Faceted Head Polygons -->
    <!-- Top Apex -->
    <polygon points="250,50 290,105 210,105" opacity="0.95" />
    <!-- Left Crown Facet -->
    <polygon points="210,105 250,50 175,130" opacity="0.85" />
    <!-- Right Crown Facet -->
    <polygon points="290,105 250,50 325,130" opacity="0.9" />
    <!-- Center Diamond Upper -->
    <polygon points="250,105 295,190 250,230 205,190" opacity="1" />
    <!-- Left Mid Facet -->
    <polygon points="210,105 205,190 175,130" opacity="0.75" />
    <!-- Right Mid Facet -->
    <polygon points="290,105 295,190 325,130" opacity="0.8" />
    <!-- Left Lower Brow -->
    <polygon points="175,130 205,190 190,260 160,210" opacity="0.7" />
    <!-- Right Lower Brow -->
    <polygon points="325,130 295,190 310,260 340,210" opacity="0.75" />
    <!-- Center Lower Beak/Nose Facet -->
    <polygon points="250,230 270,305 250,335 230,305" opacity="0.95" />
    <polygon points="205,190 250,230 230,305 210,270" opacity="0.85" />
    <polygon points="295,190 250,230 270,305 290,270" opacity="0.9" />

    <!-- Eyes (Negative/Dark Cutouts) -->
    <polygon points="214,245 238,255 220,265" fill="#0B0B0E" />
    <polygon points="286,245 262,255 280,265" fill="#0B0B0E" />

    <!-- Tentacles (Smooth Vector Shapes) -->
    <!-- Center Tentacle Left -->
    <path d="M 230,320 C 230,380 200,450 235,510 C 220,490 210,430 220,360 Z" />
    <!-- Center Tentacle Right -->
    <path d="M 270,320 C 270,380 300,450 265,510 C 280,490 290,430 280,360 Z" />
    
    <!-- Mid-Inner Tentacle Left -->
    <path d="M 190,290 C 160,350 160,430 220,490 C 170,430 180,370 205,320 Z" />
    <!-- Mid-Inner Tentacle Right -->
    <path d="M 310,290 C 340,350 340,430 280,490 C 330,430 320,370 295,320 Z" />
    
    <!-- Outer Spiral Tentacle Left -->
    <path d="M 160,240 C 120,240 100,280 120,340 C 140,400 170,420 180,440 C 160,430 130,390 125,330 C 120,280 150,260 175,260 Z" />
    <!-- Outer Spiral Tentacle Right -->
    <path d="M 340,240 C 380,240 400,280 380,340 C 360,400 330,420 320,440 C 340,430 370,390 375,330 C 380,280 350,260 325,260 Z" />
    
    <!-- High Curl Tentacle Left -->
    <path d="M 170,220 C 140,190 110,210 115,250 C 120,280 150,290 165,275 C 145,280 130,265 130,245 C 130,225 150,215 170,220 Z" />
    <!-- High Curl Tentacle Right -->
    <path d="M 330,220 C 360,190 390,210 385,250 C 380,280 350,290 335,275 C 355,280 370,265 370,245 C 370,225 350,215 330,220 Z" />
  </g>
</svg>
