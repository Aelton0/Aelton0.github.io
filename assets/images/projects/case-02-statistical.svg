<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 787" width="100%" height="100%">
  <!-- Editorial Architecture Plate: Revenue Risk Analysis (Median Model) -->
  <defs>
    <linearGradient id="paperBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEAE3" />
      <stop offset="100%" stop-color="#E2DFD6" />
    </linearGradient>
  </defs>

  <rect width="1400" height="787" fill="url(#paperBg2)" />

  <!-- Outer Editorial Border & Hairlines -->
  <rect x="40" y="40" width="1320" height="707" fill="none" stroke="#CCC9BE" stroke-width="1" />
  <line x1="40" y1="100" x2="1360" y2="100" stroke="#CCC9BE" stroke-width="1" />
  <line x1="40" y1="687" x2="1360" y2="687" stroke="#CCC9BE" stroke-width="1" />

  <!-- Header Plate Details -->
  <text x="60" y="76" font-family="'Fira Code', monospace" font-size="12" fill="#6E6250" letter-spacing="0.1em">PLATE 02.B — STATISTICAL DISTRIBUTION &amp; REVENUE RISK AUDIT</text>
  <text x="1170" y="76" font-family="'Fira Code', monospace" font-size="12" fill="#918F87" letter-spacing="0.1em">FIG. 2026.02 / ANALYTICS</text>

  <!-- Statistical Distribution Visual Drawing -->
  <g transform="translate(140, 160)">
    <!-- Axes -->
    <line x1="60" y1="40" x2="60" y2="400" stroke="#22201C" stroke-width="1.5" />
    <line x1="60" y1="400" x2="1080" y2="400" stroke="#22201C" stroke-width="1.5" />

    <!-- Grid lines -->
    <line x1="60" y1="130" x2="1080" y2="130" stroke="#D8D6CF" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="60" y1="220" x2="1080" y2="220" stroke="#D8D6CF" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="60" y1="310" x2="1080" y2="310" stroke="#D8D6CF" stroke-width="1" stroke-dasharray="2 4" />

    <!-- Y-Axis Labels -->
    <text x="15" y="134" font-family="'Fira Code', monospace" font-size="10" fill="#918F87">70% CUM</text>
    <text x="15" y="224" font-family="'Fira Code', monospace" font-size="10" fill="#918F87">50% MED</text>
    <text x="15" y="314" font-family="'Fira Code', monospace" font-size="10" fill="#918F87">20% LOW</text>

    <!-- Cumulative Lorenz / ABC Pareto Distribution Curve -->
    <path d="M 60,400 Q 150,120 400,120 T 1080,80" fill="none" stroke="#22201C" stroke-width="2.5" />

    <!-- Area Highlight for Critical Concentration (Tier A: Top 5 Accounts) -->
    <polygon points="60,400 60,130 350,130 350,400" fill="#22201C" opacity="0.08" />
    <line x1="350" y1="100" x2="350" y2="400" stroke="#6E6250" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Top 5 Accounts Vertical Callout -->
    <rect x="180" y="150" width="150" height="75" fill="#F7F6F1" stroke="#22201C" stroke-width="1" />
    <text x="195" y="175" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#0A0907">TOP 5 CLIENTS</text>
    <text x="195" y="195" font-family="'Fira Code', monospace" font-size="11" fill="#6E6250">70.2% TOTAL REV</text>
    <text x="195" y="212" font-family="'Fira Code', monospace" font-size="9" fill="#918F87">Single account: 16.4%</text>

    <!-- The Median Threshold Line -->
    <line x1="60" y1="220" x2="700" y2="220" stroke="#22201C" stroke-width="1" stroke-dasharray="6 4" />
    <rect x="520" y="205" width="200" height="30" fill="#F7F6F1" stroke="#22201C" stroke-width="1" />
    <text x="535" y="225" font-family="'Fira Code', monospace" font-size="10" fill="#0A0907">MEDIAN: R$ 4,200 / mo</text>

    <!-- The Distorted Mean (Arithmetic False Assumption) -->
    <line x1="60" y1="160" x2="700" y2="160" stroke="#918F87" stroke-width="1" stroke-dasharray="2 4" />
    <text x="710" y="164" font-family="'Fira Code', monospace" font-size="10" fill="#918F87">DISTORTED MEAN: R$ 18,900 (OUTLIER SKEW)</text>

    <!-- X-Axis Labels -->
    <text x="120" y="425" font-family="'Fira Code', monospace" font-size="10" fill="#22201C">01-05 (TIER A: VULNERABLE)</text>
    <text x="450" y="425" font-family="'Fira Code', monospace" font-size="10" fill="#918F87">06-40 (TIER B: CORE)</text>
    <text x="820" y="425" font-family="'Fira Code', monospace" font-size="10" fill="#918F87">41-350+ (TIER C: LONG TAIL)</text>
  </g>

  <!-- Technical Legend Footer -->
  <text x="60" y="715" font-family="'Fira Code', monospace" font-size="11" fill="#918F87">METHOD: PERCENTILE_CONT(0.50) / NON-PARAMETRIC ORDER STATISTICS</text>
  <text x="1230" y="715" font-family="'Fira Code', monospace" font-size="11" fill="#6E6250">AUDIT VERIFIED</text>
</svg>
